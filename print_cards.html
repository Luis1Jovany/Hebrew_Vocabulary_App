<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Print All 68+ Hebrew Vocab Lists</title>
<style>
  /* Base & Print Page Framework */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #000000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  #status {
    padding: 20px;
    background: #f3f4f6;
    border: 1px solid #d1d5db;
    margin: 20px;
    font-size: 14px;
    border-radius: 6px;
  }
  .page {
    width: 8.5in;
    height: 11in;
    padding: 0.5in 0.4in;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(4, 2.375in);
    gap: 0.25in;
    page-break-after: always;
  }
  .card {
    border: 1px dashed #aaaaaa;
    border-radius: 6px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    position: relative;
    background: #fafafa;
    overflow: hidden;
  }
  .card-front-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    width: 100%;
  }
  .hebrew-main {
    font-size: 34px;
    font-weight: bold;
    direction: rtl;
    margin-bottom: 4px;
  }
  .card-indicator {
    font-size: 9px;
    color: #888888;
    text-transform: uppercase;
    letter-spacing: 1px;
    position: absolute;
    top: 6px;
    left: 10px;
  }
  .card-meta {
    font-size: 9px;
    color: #888888;
    position: absolute;
    top: 6px;
    right: 10px;
  }
  .card-back-content {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    width: 100%;
    text-align: center;
  }
  .definition-section {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2px 6px;
  }
  .main-definition {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    color: #111111;
  }
  .related-section {
    border-top: 1px solid #e5e7eb;
    padding-top: 4px;
    margin-top: 2px;
    text-align: right;
    width: 100%;
  }
  .related-title {
    font-size: 8px;
    font-weight: bold;
    color: #666666;
    text-transform: uppercase;
    margin-bottom: 2px;
    text-align: left;
  }
  .related-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: flex-start;
    direction: rtl;
  }
  .related-item {
    font-size: 10px;
    background: #eaeaea;
    padding: 1px 4px;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .related-heb {
    font-weight: bold;
    color: #b45309;
  }
  .related-def {
    font-size: 9px;
    color: #444444;
    direction: ltr;
  }
  .no-related {
    font-size: 9px;
    color: #cccccc;
    font-style: italic;
    text-align: center;
    width: 100%;
  }
  @media screen {
    body { background: #f0f2f5; }
    .page { background: white; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  }
  @media print {
    #status { display: none; }
  }
</style>
</head>
<body>

<div id="status">
  <h3>⚡ Hebrew Flashcard Generator</h3>
  <p id="msg">Loading and parsing data from 'index.html' directly...</p>
</div>

<div id="flashcard-container"></div>

<script>
  // Dynamically pull data from your local file so no definitions or lists are lost!
  fetch('index.html')
    .then(response => {
      if (!response.ok) {
        throw new Error("Could not read 'index.html'. Please make sure this file is placed in the same folder as your original file.");
      }
      return response.text();
    })
    .then(htmlString => {
      // Find the array declaration inside the script tags
      const startIdx = htmlString.indexOf('const VOCAB_SETS = [');
      if (startIdx === -1) {
        throw new Error("Could not find the vocabulary database inside your file.");
      }
      
      // Extract everything from the token up to where the code block starts processing it
      let dataBlock = htmlString.substring(startIdx);
      const endIdx = dataBlock.indexOf('const CARDS_PER_PAGE');
      if (endIdx !== -1) {
        dataBlock = dataBlock.substring(0, endIdx);
      }

      // Safe evaluation of the array from the extracted text string
      eval(dataBlock + "; window.PARSED_DATA = VOCAB_SETS;");
      
      if (!window.PARSED_DATA) {
        throw new Error("Data parsing failed.");
      }

      processAndRender(window.PARSED_DATA);
    })
    .catch(err => {
      document.getElementById('msg').innerHTML = `<span style="color:red; font-weight:bold;">Error: ${err.message}</span><br/><br/>💡 <em>Fix: Place this printable script inside the exact same folder as your 'index.html' file so it can load the database.</em>`;
    });

  function processAndRender(vocabSets) {
    // Flatten lists together with meta markers indicating which sub-list they belong to
    let masterList = [];
    vocabSets.forEach(set => {
      set.entries.forEach(entry => {
        masterList.push({
          heb: entry.heb,
          def: entry.def,
          cognates: entry.cognates || [],
          listLabel: set.label
        });
      });
    });

    document.getElementById('status').innerHTML = `<h3>✅ Finished Processing Database!</h3><p>Loaded <strong>${vocabSets.length} sets</strong> containing a total of <strong>${masterList.length} unique flashcards</strong>. Ready to print.</p>`;

    const CARDS_PER_PAGE = 8;
    const container = document.getElementById('flashcard-container');

    // Slice total arrays out into blocks of 8 items
    for (let i = 0; i < masterList.length; i += CARDS_PER_PAGE) {
      const chunk = masterList.slice(i, i + CARDS_PER_PAGE);

      // 1. GENERATE FRONT SHEET FOR PRINT PAGE
      const frontPage = document.createElement('div');
      frontPage.className = 'page';
      
      chunk.forEach((item, idx) => {
        const absoluteIndex = i + idx + 1;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-indicator">Front</div>
          <div class="card-meta">${item.listLabel}</div>
          <div class="card-front-content">
            <div class="hebrew-main">${item.heb}</div>
          </div>
        `;
        frontPage.appendChild(card);
      });
      container.appendChild(frontPage);

      // 2. GENERATE BACK SHEET FOR PRINT PAGE (Columns are mirrored horizontally for aligned duplex printing)
      const backPage = document.createElement('div');
      backPage.className = 'page';
      
      const mirroredChunk = [];
      for (let j = 0; j < chunk.length; j += 2) {
        if (j + 1 < chunk.length) {
          mirroredChunk.push({ item: chunk[j+1], localIdx: j+1 });
          mirroredChunk.push({ item: chunk[j], localIdx: j });
        } else {
          mirroredChunk.push({ item: chunk[j], localIdx: j });
        }
      }

      mirroredChunk.forEach(obj => {
        const item = obj.item;
        const absoluteIndex = i + obj.localIdx + 1;
        
        let cognatesHtml = '';
        if (item.cognates && item.cognates.length > 0) {
          cognatesHtml = `<div class="related-title">Related Words:</div><div class="related-grid">`;
          item.cognates.forEach(c => {
            cognatesHtml += `
              <div class="related-item">
                <span class="related-heb">${c.heb}</span>
                <span class="related-def">(${c.def})</span>
              </div>`;
          });
          cognatesHtml += `</div>`;
        } else {
          cognatesHtml = `<div class="no-related">—</div>`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-indicator" style="color: #047857;">Back</div>
          <div class="card-meta">Card #${absoluteIndex}</div>
          <div class="card-back-content">
            <div class="definition-section">
              <div class="main-definition">${item.def}</div>
            </div>
            <div class="related-section">
              ${cognatesHtml}
            </div>
          </div>
        `;
        backPage.appendChild(card);
      });
      container.appendChild(backPage);
    }
  }
</script>
</body>
</html>
