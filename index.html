<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hebrew Vocab Game</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Assistant:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #ff2e88;
  --green: #00ff9d;
  --dark: #0d0d0d;
  --panel: #171717;
  --white: #f5f5f5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Assistant', sans-serif;
  background: radial-gradient(circle at top, #1f1f1f, #090909);
  color: var(--white);
  min-height: 100vh;
}

header {
  padding: 24px;
  text-align: center;
  border-bottom: 2px solid var(--pink);
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(10px);
}

header h1 {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  color: var(--pink);
  font-size: 2.5rem;
  text-shadow: 0 0 20px var(--pink);
}

header p {
  color: var(--green);
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

button {
  background: var(--pink);
  border: none;
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  transition: .2s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px var(--pink);
}

.card {
  background: var(--panel);
  border: 2px solid #2a2a2a;
  border-radius: 18px;
  padding: 30px;
  margin-bottom: 24px;
  box-shadow: 0 0 25px rgba(255,46,136,.2);
}

.hebrew {
  font-size: 3rem;
  text-align: center;
  direction: rtl;
  margin-bottom: 12px;
  color: var(--green);
}

.meaning {
  text-align: center;
  font-size: 1.2rem;
}

.meta {
  text-align: center;
  color: #aaa;
  margin-bottom: 20px;
}

.quiz {
  margin-top: 20px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 2px solid #333;
  background: #0f0f0f;
  color: white;
  font-size: 1rem;
}

.result {
  margin-top: 12px;
  font-weight: bold;
}

.cognates {
  margin-top: 24px;
  border-top: 1px solid #333;
  padding-top: 16px;
}

.cognate {
  padding: 12px;
  background: #101010;
  margin-bottom: 10px;
  border-radius: 10px;
}

.progress {
  margin-bottom: 20px;
  color: var(--green);
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}

@media(max-width:700px) {
  .hebrew {
    font-size: 2.2rem;
  }
}
</style>
</head>
<body>

<header>
  <h1>HEBREW VOCAB GAME</h1>
  <p>Squid Game Edition • Learn in the exact order of your document</p>
</header>

<div class="container">
  <div class="controls">
    <button onclick="prevCard()">◀ Previous</button>
    <button onclick="flipCard()">Reveal Meaning</button>
    <button onclick="nextCard()">Next ▶</button>
    <button onclick="shuffleMode()">Shuffle Mode</button>
  </div>

  <div class="progress" id="progress"></div>

  <div class="card">
    <div class="meta" id="meta"></div>
    <div class="hebrew" id="hebrew"></div>
    <div class="meaning" id="meaning">???</div>

    
    <div class="quiz">
      <div id="options"></div>
      <div class="result" id="result"></div>
    </div>


    <div class="cognates">
      <h3 style="color: var(--pink);">Related Cognates</h3>
      <div id="cognates"></div>
    </div>
  </div>
</div>

<footer>
  Built for GitHub Pages • Squid Game Inspired Hebrew Learning
</footer>

let current = 0;
let revealed = false;
let shuffled = false;
let activeList = [...vocab];

function render() {
  const item = activeList[current];

  document.getElementById("meta").innerText =
    `${item.vocab} • Word ${current + 1} / ${activeList.length}`;

  document.getElementById("hebrew").innerText = item.hebrew;
  document.getElementById("meaning").innerText =
    revealed ? item.meaning : "???";

  document.getElementById("progress").innerText =
    `Progress: ${current + 1} of ${activeList.length}`;

  const cognatesDiv = document.getElementById("cognates");
  cognatesDiv.innerHTML = "";

  item.cognates.forEach(c => {
    const div = document.createElement("div");
    div.className = "cognate";
    div.innerHTML = `<div style="direction:rtl;font-size:1.3rem;color:var(--green);">${c.hebrew}</div>
                     <div>${c.meaning}</div>`;
    cognatesDiv.appendChild(div);
  });

  document.getElementById("answerInput").value = "";
  document.getElementById("result").innerText = "";
}

function nextCard() {
  current = (current + 1) % activeList.length;
  revealed = false;
  render();
}

function prevCard() {
  current = (current - 1 + activeList.length) % activeList.length;
  revealed = false;
  render();
}

function flipCard() {
  revealed = !revealed;
  render();
}

function checkAnswer() {
  const input = document.getElementById("answerInput").value.toLowerCase();
  const answer = activeList[current].meaning.toLowerCase();

  if(answer.includes(input) && input.length > 2) {
    document.getElementById("result").innerText = "✔ Correct";
    document.getElementById("result").style.color = "#00ff9d";
  } else {
    document.getElementById("result").innerText = "✖ Try again";
    document.getElementById("result").style.color = "#ff2e88";
  }
}

function shuffleMode() {
  shuffled = !shuffled;

  if(shuffled) {
    activeList = [...vocab].sort(() => Math.random() - 0.5);
  } else {
    activeList = [...vocab];
  }

  current = 0;
  revealed = false;
  render();
}

render();
</script>
